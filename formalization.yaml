version: v0.4
project:
  name: Szemerédi's Theorem Along Cantor Sets of Integers
  description: >-
    Lean 4 formalization of the three main results of Szemerédi's Theorem Along
    Cantor Sets of Integers. For an integer Cantor set C = {0 = k_0 < k_1 < ...}
    with base b >= 3 and digit set D containing 0 (2 <= |D| < b), every invertible
    measure preserving system has positive uniform lower averages of the multiple
    correlations of a non-negative non-zero bounded function along the steps
    j k_n (Theorem t:CSZ); the indices with positive correlation form a syndetic
    set (Corollary c:syndetic); and every set of integers of positive upper Banach
    density has a syndetic set of indices n for which the progressions with step
    k_n occur with positive upper Banach density (Theorem t:CSZ-Integers). The
    Furstenberg-Zimmer dichotomy, which the paper cites, is proved here for all
    measure preserving systems on standard Borel spaces.
  authors:
  - Michael Lacey
  responsible_maintainers:
  - Michael Lacey
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: Szemerédi's Theorem Along Cantor Sets of Integers
  authors:
