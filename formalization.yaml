  - Anastasios Fragkos
  - Michael T. Lacey
  - Dario Mena
  - Maria Carmen Reguera
  type: paper
  location: Theorem t:CSZ, Corollary c:syndetic, Theorem t:CSZ-Integers
  relationship: formalizes
  note: >-
    arXiv:2602.15299v2. Errata and deviations, with locations, are in
    docs/ERRATA-AND-DEVIATIONS.md. The files in CantorSzemeredi/Port/ are ported,
    unchanged in their mathematics, from the authors' earlier partial
    formalization at commit d29e8f9 of this same repository
    (github.com/lacey-gatech/CantorSzemeredi), into which this development has
    since been merged. Port/ also carries that formalization's van der Waerden
    chapter and other results the three main theorems do not use; they are proved
    and are kept, but nothing outside the main line is claimed here.
