fidelity:
  divergences: >-
    "Invertible" is read as a bijection measurable in both directions
    (T : X ≃ᵐ X) preserving a probability measure; "not identically zero" for
    f in L^∞ as ¬ f =ᵐ[m] 0; the uniform liminf of averages as "there are c > 0
    and L with every average over an index interval of length at least L at
    least c"; the upper Banach density as inf over L of the sup of interval
    densities over intervals of length at least L. The proof uses conditional
    compactness with the minimum inside the L^∞ norm, as in the paper's proofs
    (see erratum E1), and reaches every system through the dichotomy for standard
    Borel systems rather than the ergodic decomposition (deviation V1).
