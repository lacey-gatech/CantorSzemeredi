name: Lean build

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lake build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare build space
        # These unused SDKs are removed only on the disposable hosted runner.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h .

      - name: Set up pinned Lean and the Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: Build the formalization
        run: lake build

      - name: Build the Palomar challenge and solution
        run: lake build Challenge Solution

      - name: Axiom audit of the main theorems
        run: python3 -I scripts/axiom_audit.py

      - name: Solution proves exactly the challenge statements
        run: python3 -I scripts/challenge_match.py

      - name: Frozen statements and source policy
        run: python3 -I scripts/check_frozen_anchors.py --root . --manifest docs/frozen-manifest.json
